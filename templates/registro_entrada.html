<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>COPAR –
        {% if role == 'classificacao' %}Entrada na Classificação
        {% elif role == 'banca' %}Transferência para Banca
        {% else %}Transferência para Toletagem{% endif %}
    </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --verde:        #2a5c28;
            --verde-mid:    #3d7a3a;
            --verde-light:  #e8f2e7;
            --verde-pale:   #f4f9f3;
            --bg:           #f2f5f0;
            --text:         #1a2e19;
            --muted:        #6b7c6a;
            --border:       #dde8db;
            --white:        #ffffff;
            --danger:       #c0392b;
            --danger-bg:    #fdecea;
            --danger-bord:  #f5c6c2;
            --ouro:         #c8a94a;
            --ouro-bg:      #fffbec;
            --ouro-bord:    #e8d78a;
            --ind:          #8e44ad;
            --ind-bg:       #f4ecf7;
            --ind-bord:     #d7bde2;
            --radius:       12px;
            --shadow:       0 4px 20px rgba(42,92,40,.1);
        }

        body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100dvh; padding-bottom:5.5rem; }

        nav { background:var(--verde); padding:.85rem 1.25rem; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:200; }
        .nav-brand { font-family:'DM Serif Display',serif; color:var(--white); font-size:1.2rem; }
        .nav-title  { color:rgba(255,255,255,.8); font-size:.75rem; margin-top:.1rem; }
        .btn-sair { background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.3); color:var(--white); padding:.4rem .85rem; border-radius:8px; font-size:.82rem; text-decoration:none; white-space:nowrap; }

        .status-wrap { max-width:760px; margin:.75rem auto 0; padding:0 1rem; }
        .status-bar { padding:.8rem 1rem; border-radius:var(--radius); font-size:.88rem; font-weight:500; display:none; align-items:center; gap:.5rem; }
        .status-bar.show { display:flex; }
        .status-bar.success { background:#d5f0de; color:#1a6b35; }
        .status-bar.error   { background:var(--danger-bg); color:var(--danger); }
        .status-bar.info    { background:#e3ecf7; color:#1a5276; }
        .status-bar.warning { background:#fef5e7; color:#7d5a00; }

        main { max-width:760px; margin:0 auto; padding:1rem; }

        .card { background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:1rem; overflow:visible; }
        .card-header { padding:.8rem 1.1rem; border-bottom:1px solid var(--border); font-weight:700; font-size:.88rem; color:var(--verde); display:flex; align-items:center; gap:.5rem; }
        .card-body { padding:1rem 1.1rem; }

        .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:.75rem; }
        @media(max-width:480px) { .grid2 { grid-template-columns:1fr; } }

        .field { display:flex; flex-direction:column; gap:.3rem; }
        .field label { font-size:.72rem; font-weight:700; color:var(--verde); text-transform:uppercase; letter-spacing:.06em; }
        .field input, .field select { padding:.75rem 1rem; border:2px solid var(--border); border-radius:10px; font-family:'DM Sans',sans-serif; font-size:.95rem; color:var(--text); background:var(--verde-pale); }
        .field input:focus, .field select:focus { outline:none; border-color:var(--verde); box-shadow:0 0 0 3px rgba(42,92,40,.1); }
        .field input[readonly] { background:#f0f0f0; color:var(--muted); }

        .ac-wrap { position:relative; }
        .ac-list { position:absolute; top:calc(100% + 4px); left:0; right:0; background:var(--white); border:1.5px solid var(--verde); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.13); max-height:230px; overflow-y:auto; z-index:500; display:none; }
        .ac-item { padding:.75rem 1rem; cursor:pointer; border-bottom:1px solid var(--border); font-size:.9rem; }
        .ac-item:hover { background:var(--verde-light); }
        .ac-item strong { color:var(--verde); }

        .prod-banner { background:var(--verde-light); border:1.5px solid #b8d9b5; border-radius:10px; padding:.6rem 1rem; font-size:.86rem; color:var(--verde); font-weight:600; margin-top:.5rem; display:none; align-items:center; gap:.5rem; }
        .prod-banner.show { display:flex; }

        .pills { display:flex; gap:.5rem; flex-wrap:wrap; }
        .pill { padding:.55rem 1.1rem; border-radius:30px; border:2px solid var(--border); background:var(--white); font-family:'DM Sans',sans-serif; font-size:.88rem; cursor:pointer; font-weight:600; }
        .pill.active { background:var(--verde); border-color:var(--verde); color:var(--white); }

        .saldo-tag { font-size:.74rem; color:var(--verde-mid); margin-top:.25rem; font-weight:600; min-height:1.1rem; }
        .saldo-loading { display:none; align-items:center; gap:.5rem; font-size:.82rem; color:var(--muted); padding:.4rem 0; }
        .saldo-loading.show { display:flex; }
        .mini-spin { width:16px; height:16px; border:2px solid #cde2be; border-top-color:var(--verde); border-radius:50%; animation:spin .7s linear infinite; }
        @keyframes spin { to{transform:rotate(360deg)} }

        /* HORAS DE BANCA (campo único) */
        .horas-box {
            background: var(--verde-pale);
            border: 1.5px dashed #b8d9b5;
            border-radius: 10px;
            padding: .85rem 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-top: .75rem;
        }
        .horas-box .horas-label { flex: 1; font-size: .82rem; font-weight: 600; color: var(--verde); }
        .horas-box .horas-label small { display: block; font-weight: 400; color: var(--muted); font-size: .72rem; margin-top: .15rem; }
        .horas-box input {
            width: 100px;
            padding: .55rem .7rem;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-family: 'DM Sans', sans-serif;
            font-size: .95rem;
            text-align: right;
            font-weight: 600;
        }

        /* PESAGEM - NOVA ESTRUTURA POR CLASSE */
        .peso-list { display:flex; flex-direction:column; gap:.75rem; }

        .classe-card {
            border: 1.5px solid var(--border);
            border-radius: 10px;
            background: var(--verde-pale);
            padding: .75rem .9rem;
            transition: border-color .15s;
        }
        .classe-card:focus-within { border-color: var(--verde); }
        .classe-card.excede { border-color: var(--danger); background: var(--danger-bg); }
        .classe-card.ind-card { background: var(--ind-bg); border-color: var(--ind-bord); }

        .classe-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: .6rem;
            padding-bottom: .5rem;
            border-bottom: 1px dashed var(--border);
        }
        .classe-nome { font-weight: 700; font-size: .95rem; color: var(--text); }
        .classe-saldo { font-size: .74rem; color: var(--muted); font-weight: 600; }
        .classe-saldo strong { color: var(--verde); }

        .classe-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: .55rem;
        }
        @media(max-width:520px) {
            .classe-inputs { grid-template-columns: 1fr; }
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: .2rem;
        }
        .input-group label {
            font-size: .64rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: var(--muted);
        }
        .input-group input {
            padding: .55rem .65rem;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-family: 'DM Sans', sans-serif;
            font-size: .92rem;
            text-align: right;
            background: var(--white);
            font-weight: 600;
        }
        .input-group input:focus { outline: none; border-color: var(--verde); }
        .input-group.ind input { border-color: var(--ind-bord); background: #fbf7fd; }
        .input-group.ind input:focus { border-color: var(--ind); }
        .input-group.perda input { border-color: #f0c080; background: #fffbec; }

        .total-geral {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: .9rem 1rem;
            background: var(--verde);
            color: var(--white);
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            margin-top: .75rem;
        }

        .sem-estoque { text-align:center; padding:2rem 1rem; color:var(--muted); font-size:.88rem; }

        /* BOTÕES FIXOS */
        .botoes { position:fixed; bottom:0; left:0; right:0; background:rgba(242,245,240,.97); backdrop-filter:blur(8px); padding:.8rem 1rem; display:flex; gap:.6rem; border-top:1px solid var(--border); z-index:100; }
        .btn { flex:1; padding:.85rem .5rem; border:none; border-radius:var(--radius); font-family:'DM Sans',sans-serif; font-weight:700; font-size:.9rem; cursor:pointer; }
        .btn-primary   { background:var(--verde); color:var(--white); }
        .btn-secondary { background:var(--verde-light); color:var(--verde); border:1.5px solid #b8d9b5; }
        .btn-danger    { background:var(--danger-bg); color:var(--danger); border:1.5px solid var(--danger-bord); }
        .btn:disabled  { opacity:.5; pointer-events:none; }

        .spinner { display:inline-block; width:16px; height:16px; border:2px solid rgba(255,255,255,.4); border-top-color:var(--white); border-radius:50%; animation:spin .8s linear infinite; vertical-align:middle; margin-right:6px; }

        .suc-overlay { position:fixed; inset:0; background:rgba(30,68,28,.93); display:none; flex-direction:column; align-items:center; justify-content:center; z-index:999; text-align:center; padding:2rem; }
        .suc-overlay.show { display:flex; }
        .suc-icon  { font-size:4rem; margin-bottom:1rem; }
        .suc-title { font-size:1.5rem; font-weight:700; color:var(--white); margin-bottom:.4rem; font-family:'DM Serif Display',serif; }
        .suc-msg   { color:rgba(255,255,255,.85); font-size:.9rem; margin-bottom:2rem; max-width:400px; line-height:1.55; }
        .suc-btn   { background:var(--white); color:var(--verde); border:none; border-radius:40px; padding:.9rem 2.5rem; font-family:'DM Sans',sans-serif; font-weight:700; font-size:1rem; cursor:pointer; }

        /* MODAL CADASTRO */
        .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:800; display:none; align-items:center; justify-content:center; padding:1rem; }
        .modal-bg.open { display:flex; }
        .modal { background:var(--white); border-radius:16px; width:100%; max-width:440px; padding:1.5rem; }
        .modal-title { font-family:'DM Serif Display',serif; font-size:1.15rem; color:var(--verde); margin-bottom:1rem; }
        .modal-field { display:flex; flex-direction:column; gap:.3rem; margin-bottom:.75rem; }
